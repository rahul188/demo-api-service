name: MCP with GitHub App Auth

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-with-mcp-auth:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          installation-id: ${{ secrets.APP_INSTALLATION_ID }}
      
      - name: Test GitHub API with App Token
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Testing GitHub API access..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }} | jq '.name, .private'
      
      - name: Print Token Info
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "📝 Token Information:"
          echo "Token preview: $(echo $GITHUB_TOKEN | cut -c1-20)..."
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "Repository: ${{ github.repository }}"
          echo "Owner: ${GITHUB_REPOSITORY_OWNER}"
          echo "Repo name: ${GITHUB_REPOSITORY##*/}"
      
      - name: Run GitHub MCP Server - List Repository Files
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "🚀 Using MCP to list repository files"
          
          echo '{"method":"tools/call","params":{"name":"list_files","arguments":{"owner":"'"${GITHUB_REPOSITORY_OWNER}"'","repo":"'"${GITHUB_REPOSITORY##*/}"'","path":""}}}' | \
          docker run -i --rm \
            -e GITHUB_PERSONAL_ACCESS_TOKEN="${GITHUB_PERSONAL_ACCESS_TOKEN}" \
            -e GITHUB_TOOLSETS="repos" \
            ghcr.io/github/github-mcp-server
          
          echo "✅ MCP tool executed"